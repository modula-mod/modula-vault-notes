name: verify

on:
  push:
  pull_request:

jobs:
  vault-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: modula-vault-notes
      - uses: actions/checkout@v4
        with:
          repository: modula-mod/modula-module-standard
          ref: eebf12c7df0583a5051fc584170f7f3a9f6d946c
          path: modula-module-standard
      - uses: actions/checkout@v4
        with:
          repository: modula-mod/modula-product-standard
          ref: 582092b41d8da5f0f04f5f5302d54a9004d87487
          path: modula-product-standard
          ssh-key: ${{ secrets.MPS_READONLY_DEPLOY_KEY }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modula-vault-notes/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: modula-module-standard
      - run: pnpm build
        working-directory: modula-module-standard
      - run: pnpm install --frozen-lockfile
        working-directory: modula-product-standard
      - run: pnpm build
        working-directory: modula-product-standard
      - run: pnpm install --frozen-lockfile
        working-directory: modula-vault-notes
      - run: pnpm verify
        working-directory: modula-vault-notes
      - run: git diff --exit-code -- frontend/frontend.manifest.json modula.product.json
        working-directory: modula-vault-notes
      - run: pnpm mps verify ../modula-vault-notes
        working-directory: modula-product-standard
